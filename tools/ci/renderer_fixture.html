<!doctype html>
<meta charset="utf-8">
<title>cogchemists renderer fixture</title>
<!--
  WORST-CASE FRAME for the stage renderer, driven directly.

  Why this exists, and why viewer_smoke.mjs on a replay is not enough:
  CI has no ANTHROPIC_API_KEY, so every seat in docker_smoke's episode falls
  back to `scriptedAction`, which "never talks or notes" (llm.nim). Every
  replay CI can produce therefore carries ZERO `say` events, and the wasm
  viewer never draws a speech bubble. The bug of 2026-08-24 -- bubbles grown
  upward from the top of the cog, landing at a negative y and rendering as
  white slivers -- was invisible to every gate we had for exactly that reason.

  So this page skips the replay entirely and hands the renderer a frame built
  to hurt: a MaxSayLen remark on every seat at once, one of them in a script
  whose glyphs are twice as wide, a full hand, both artifact badges, and a
  lab bench mid-slide. It renders at five canvas sizes and sets
  data-replay-loaded when the last one has settled, so viewer_smoke.mjs can
  drive it with --strict-text-bounds like any other viewer.

  Served from a directory holding renderer.js and assets/ -- see ci.yml's
  "Draw the worst-case frame" step.
-->
<style>
  body { margin: 0; background: #0b1020; font: 12px monospace; color: #ccc; }
  h3 { margin: 6px 0 2px; }
  canvas { display: block; background: #16110d; }
</style>
<div id="frames"></div>
<script src="./renderer.js"></script>
<script>
(function () {
  "use strict";

  // The canvas sizes the viewer is actually seen at: the featured-match
  // embed, viewer_smoke's own 1280x800 viewport, and down to the narrow
  // branch. Each gets its own canvas so one run covers them all.
  var SIZES = [[1700, 790], [1280, 668], [1024, 600], [900, 560], [640, 420]];

  // MaxSayLen (sim.nim). Kept here as a number the fixture can CHECK against
  // its own strings at runtime -- a remark that quietly stopped being
  // full-length would make this whole fixture stop testing anything.
  var CAP = 140;

  var SAYS = [
    "Nightcap and Fen Lily both came back RED- for me, so the pairing has to be carrying the red aspect; I am publishing that seal before Sunmos.",
    "Widow's Salt is the only ingredient left that can explain the GREEN+ result, and I will endorse anyone who seals it this round, no question.",
    // A rune-counted cap is not a WIDTH cap: 140 CJK glyphs run about twice
    // as wide as 140 Latin ones, so the band -- measured on Latin prose --
    // is too small and this one SHOULD ellipsize. What it must not do is
    // leave the frame. The gate is never-inside, not ellipsized.
    "\u6211\u8ba4\u4e3a\u591c\u5e3d\u8349\u548c\u6cbc\u767e\u5408\u90fd\u663e\u793a\u7ea2\u8272\u4e3a\u8d1f\u56e0\u6b64\u8fd9\u5bf9\u7ec4\u5408\u4e00\u5b9a\u5e26\u6709\u7ea2\u8272\u7279\u5f81\u6211\u6253\u7b97\u5728\u82d4\u85d3\u4e4b\u524d\u5148\u516c\u5e03\u8fd9\u4e2a\u5c01\u5370\u5e76\u4e14\u6211\u4f1a\u652f\u6301\u4efb\u4f55\u540c\u610f\u8fd9\u4e2a\u7ed3\u8bba\u7684\u4eba\u56e0\u4e3a\u8bc1\u636e\u5df2\u7ecf\u8db3\u591f\u5145\u5206\u4e86\u73b0\u5728\u8f6e\u5230\u4f60\u4eec\u6765\u9a8c\u8bc1\u8fd9\u4e2a\u8bf4\u6cd5\u662f\u5426\u6b63\u786e\u6211\u4eec\u9700\u8981\u66f4\u591a\u7684\u5b9e\u9a8c\u6570\u636e\u6765\u786e\u8ba4\u8fd9\u4e2a\u5047\u8bbe\u662f\u5426\u6210\u7acb\u8bf7\u5927\u5bb6\u4ed4\u7ec6\u6838\u5bf9\u6bcf\u4e00\u6761\u8bb0\u5f55\u5e76\u5c3d\u5feb\u7ed9\u51fa\u4f60\u4eec\u81ea\u5df1\u7684\u5224\u65ad\u7ed3\u679c\u8c22\u8c22",
    // And a trivial one, so a SHORT remark is covered too.
    "Short one."
  ];

  // Three of the four must be exactly the cap, in RUNES. If an edit shortens
  // one, this fixture would still pass while testing less than it claims, so
  // say so loudly instead.
  (function () {
    var atCap = SAYS.filter(function (say) {
      return Array.from(say).length === CAP;
    }).length;
    if (atCap !== 3) {
      document.documentElement.setAttribute("data-replay-error",
        "renderer fixture: expected 3 remarks of exactly " + CAP +
        " runes, found " + atCap);
    }
  })();

  var INGREDIENTS = ["Nightcap", "Emberroot", "Fen Lily", "Widow's Salt",
    "Copper Fern", "Gravebloom", "Sunmoss", "Rime Thistle"];

  function seat(index) {
    return {
      name: ["Sprocket", "Gizmo", "Ratchet", "Widget"][index],
      coin: 4 + index,
      reputation: index === 3 ? -6 : 10,
      score: 0,
      // A full hand and BOTH artifacts: the tallest the station block gets,
      // which is the case the bubble band has to leave room for.
      hand: INGREDIENTS.slice(0, 4),
      handCount: 4,
      mortar: true,
      press: true,
      published: [], endorsed: [], notes: "",
      pending: index === 1,
      grid: Array.from({ length: 8 }, function () { return [0, 1, 2, 3, 4, 5, 6, 7]; }),
      chemistries: 23040,
      solved: 0,
      say: SAYS[index]
    };
  }

  function view(now, benchAt) {
    return {
      seats: [0, 1, 2, 3].map(seat),
      seatNames: ["Sprocket", "Gizmo", "Ratchet", "Widget"],
      seals: [{ seat: 0, ingredient: 0, signature: 3, round: 2, standing: true },
              { seat: 3, ingredient: 6, signature: 5, round: 3, standing: true }],
      publicFacts: [{ a: 0, b: 2, potion: "RED-" }, { a: 1, b: 4, potion: "MUD" }],
      bench: { seat: 1, a: 2, b: 6, potion: "BLUE-", secret: false },
      ingredients: INGREDIENTS,
      round: 3, rounds: 6, roundsPlayed: 2,
      phase: "LAB", demand: "BLUE-", chemistry: [],
      started: true, exhibited: false,
      now: now,
      effects: {
        benchAt: benchAt, burnAt: null,
        sayAt: [now, now, now, now],
        lastSay: SAYS
      }
    };
  }

  var host = document.getElementById("frames");
  var pending = SIZES.length;

  SIZES.forEach(function (size) {
    var label = document.createElement("h3");
    label.textContent = size[0] + "x" + size[1];
    host.appendChild(label);
    var canvas = document.createElement("canvas");
    canvas.width = size[0];
    canvas.height = size[1];
    host.appendChild(canvas);

    window.CogchemistsRenderer.makeRenderer(canvas, "assets", function (r) {
      var t0 = 1000000;
      var start = performance.now();
      // The bench slides its two ingredient cards on from off-frame, so the
      // frame is ANIMATED rather than still: a still frame frozen mid-slide
      // would leave those two labels never-inside and fail the gate for a
      // reason that is not a bug. Playing it through lets them settle.
      (function step() {
        var elapsed = performance.now() - start;
        r.draw(view(t0 + elapsed, t0));
        if (elapsed < 1600) {
          requestAnimationFrame(step);
          return;
        }
        canvas.setAttribute("data-drawn", "1");
        pending -= 1;
        if (pending === 0) {
          document.documentElement.setAttribute("data-replay-loaded", "true");
        }
      })();
    });
  });

  window.addEventListener("error", function (event) {
    document.documentElement.setAttribute("data-replay-error",
      String(event && event.message));
  });
})();
</script>
